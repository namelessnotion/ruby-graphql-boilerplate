services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./ruby/.env.development:/env/.env.development:ro
      - ./ruby/.env.test:/env/.env.test:ro
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # The local OTLP backend: an OpenTelemetry Collector, Tempo (traces),
  # Prometheus (metrics), Loki (logs) and Grafana, all in one image. The app
  # speaks OTLP — a wire protocol, not a vendor SDK — so this whole service is
  # swappable for a hosted backend later without touching application code.
  #
  # Behind a profile, so the plain `docker compose up -d` everything else
  # needs stays as fast and as small as it is today. Start it with:
  #
  #   docker compose --profile observability up -d
  #
  # Pinned by digest as well as tag: the tag moves, and an observability
  # backend that quietly changes version underneath a stack is exactly the
  # thing that makes "my spans stopped showing up" hard to diagnose.
  otel:
    profiles: [observability]
    image: grafana/otel-lgtm:0.33.0@sha256:475319e883b66594d1a2f22ef168c2459802bb94548e6f25d9782bd5f5c19a3a
    ports:
      - "3000:3000" # Grafana
      - "3100:3100" # Loki — queried directly by bin/doctor and by hand
      - "4317:4317" # OTLP/gRPC — where the Ruby exporter sends by default
      - "4318:4318" # OTLP/HTTP — the only one a browser can reach
    volumes:
      - otel_data:/data
      - ./docker/otel/otelcol-config.yaml:/otel-lgtm/otelcol-config.yaml:ro
      # Read-only tail source for the filelog receiver (see
      # docker/otel/otelcol-config.yaml): the app runs on the host via
      # `bin/server`, not in a container, so LOG_FILE writing here is the seam
      # that gets its structured logs into Loki.
      - ./ruby/log:/var/log/stack-api:ro
    # No healthcheck here: the image ships one that checks all five processes
    # inside it, which is more than anything written at this level could.

volumes:
  postgres_data:
  redis_data:
  otel_data:
