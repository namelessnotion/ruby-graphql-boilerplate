name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  ruby:
    name: Ruby specs
    runs-on: ubuntu-latest
    services:
      # A bare admin superuser, matching compose.yml's local dev setup — not
      # the app's own role/database. `rake db:init` (below) provisions those
      # from ruby/.env.test, same as a fresh developer machine would.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      # Needed by the redis connection specs; the database index comes from
      # ruby/.env.test's REDIS_URL, so nothing to provision here.
      redis:
        image: redis:8-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4.10
          bundler-cache: true
          working-directory: ruby

      # The service above only creates the bootstrap admin role, so this
      # exercises the same create-then-migrate path a fresh developer machine
      # takes (see README's Database setup) rather than a CI-only shortcut.
      - name: Create the test database
        working-directory: ruby
        run: bundle exec rake "db:init[test]"

      - name: Migrate the test database
        working-directory: ruby
        run: bundle exec bin/migrate up
        env:
          APP_ENV: test

      - name: Run Ruby specs
        working-directory: ruby
        run: bundle exec rspec
